[package]
name = "spotter"
version = "0.4.0"
repository = "https://github.com/Project-Colony/Spotter"
edition = "2021"
rust-version = "1.90"
description = "A cross-platform game library tracker and statistics dashboard"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14.0", features = ["image"] }
ureq = { version = "3.4.2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
csv = "1.4.0"
scraper = "0.27.0"
keyring = "4.2.0"
# The `Entry` that keyring 4 builds on, and its mock store for tests.
keyring-core = "1.0.0"

[build-dependencies]
# Windows version resource (ProductName, ProductVersion) for code signing.
winresource = { version = "0.1.31", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
