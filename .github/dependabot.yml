version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    # No groups: Cargo.lock is not committed, so Dependabot only raises bumps
    # outside the current requirement, which are breaking 0.x releases. Keep
    # each one in its own PR.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
