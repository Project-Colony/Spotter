name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --locked --verbose

      # Same check as the release build: SignPath only signs an .exe whose
      # version resource names the project and the version (build.rs).
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item target\debug\spotter.exe).VersionInfo
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)'"
          if ($info.ProductName -cne 'Spotter' -or $info.ProductVersion -cne $version) {
            Write-Error "expected ProductName 'Spotter' and ProductVersion '$version'"
            exit 1
          }

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Security audit
        run: cargo install cargo-audit --locked && cargo audit

  # Cargo.toml promises rust-version = 1.90. An untested floor is a guess
  # (design/dependencies.md in Project-Colony-Resources), so the promise is
  # built and tested here on exactly that toolchain, from the committed lock.
  msrv:
    name: Minimum supported Rust (1.90)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: "1.90"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Build on the declared floor
        run: cargo build --locked

      - name: Run tests on the declared floor
        run: cargo test --locked
