name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup is on every GitHub-hosted runner image, so there is no
      # third-party toolchain action to pin. bash keeps the same step working
      # on the Windows and macOS legs.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --locked --verbose

      # Same check as the release build: SignPath only signs an .exe whose
      # version resource names the project and the version (build.rs).
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item target\debug\spotter.exe).VersionInfo
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)'"
          if ($info.ProductName -cne 'Spotter' -or $info.ProductVersion -cne $version) {
            Write-Error "expected ProductName 'Spotter' and ProductVersion '$version'"
            exit 1
          }

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Security audit
        run: cargo install cargo-audit --locked && cargo audit

  # Cargo.toml promises rust-version = 1.90. An untested floor is a guess
  # (design/dependencies.md in Project-Colony-Resources), so the promise is
  # built and tested here on exactly that toolchain, from the committed lock.
  msrv:
    name: Minimum supported Rust (1.90)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.90
        shell: bash
        run: |
          rustup toolchain install 1.90 --profile minimal --no-self-update
          rustup default 1.90

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Build on the declared floor
        run: cargo build --locked

      - name: Run tests on the declared floor
        run: cargo test --locked
