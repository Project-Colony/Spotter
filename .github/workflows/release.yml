name: Release

on:
  push:
    branches: [main]
  # Recovery path: finish an existing DRAFT release whose run failed. Start it
  # from the tag (`gh workflow run release.yml --ref v0.3.0 -f tag=v0.3.0`):
  # with SignPath on, sign-and-publish refuses a run whose commit is not the
  # tag's, since SignPath records the run's commit as the source it signs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release to build, sign and publish (e.g. v0.3.0). Run from that same tag."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Step 1 - Release Please analyses commits and opens/updates a release PR.
  # When that PR is merged it creates a GitHub Release + tag automatically.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input: when it is set, the action ignores both files.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please publishes the release before any binary exists. Held as
      # a draft; sign-and-publish refuses anything else and publishes it last.
      - name: Hold the release as a draft
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  # Step 2 - Build cross-platform binaries when a release was created, or on a
  # recovery dispatch (when release-please is skipped). The legs only build
  # and upload artifacts; they never see a key.
  build:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any
    # job leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: spotter-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: spotter-windows.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: spotter-macos-arm
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: spotter-macos-x86

    steps:
      # The tag, not the branch: a recovery dispatch must rebuild the tagged
      # commit, since the .meta sidecar binds these bytes to that version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/spotter ${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\spotter.exe ${{ matrix.asset }}

      # Fail the release before upload if the binary does not start or reports
      # the wrong version. bash on every runner so Windows waits for the
      # GUI-subsystem exe and captures its stdout. The x86_64 macOS binary runs
      # under Rosetta on the arm64 runner.
      - name: Smoke-test binary
        shell: bash
        run: |
          out=$(./${{ matrix.asset }} --version)
          echo "$out"
          [ "$out" = "spotter ${TAG#v}" ]

      # SignPath only signs an .exe whose version resource names the project
      # and the release (build.rs embeds it).
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item "${{ matrix.asset }}").VersionInfo
          $version = $env:TAG.TrimStart('v')
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)'"
          if ($info.ProductName -cne 'Spotter' -or $info.ProductVersion -cne $version) {
            Write-Error "expected ProductName 'Spotter' and ProductVersion '$version'"
            exit 1
          }

      # The file at the artifact root, under its release name. The name
      # prefix is what `artifact-pattern` below matches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # Step 3 - Authenticode (SignPath, once approved), the org ed25519 .sig,
  # .meta and .meta.sig over the final bytes, upload, verify and publish.
  # Colony >= 0.8.0 verifies these signatures on install and REFUSES a
  # tampered asset. See design/releases.md in Project-Colony-Resources,
  # section "Shared signing workflow".
  sign-and-publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # main
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      assets: "spotter-linux spotter-windows.exe spotter-macos-arm spotter-macos-x86"
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "spotter"
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
